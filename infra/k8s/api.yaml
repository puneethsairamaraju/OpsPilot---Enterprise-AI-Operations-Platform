apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: opspilot-api}
  template:
    metadata:
      labels: {app: opspilot-api}
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/opspilot:latest
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: opspilot-secrets}}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-api
spec:
  selector: {app: opspilot-api}
  ports: [{port: 80, targetPort: 8000}]

